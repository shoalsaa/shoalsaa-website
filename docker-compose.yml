# Local WordPress test site for the ShoalsAA site-report plugin.
# Test-only credentials below — this stack never touches the live site.
# Run from the repo root:  docker compose up -d
# Then open http://localhost:8080 and finish the WordPress install.
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: wordpress
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:7.1.4-php8.4-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - ./site-report-plugin:/var/www/html/wp-content/plugins/shoalsaa-site-report

volumes:
  db_data:
