# Local WordPress test site for the ShoalsAA site-report plugin.
# Test-only credentials; do not use this stack with production data or passwords.
# Run from the repository root: docker compose up --pull always -d
# WordPress: http://localhost:8080 | Mailpit UI: http://localhost:8025
services:
  db:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: wordpress
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pwordpress"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: shoalsaa-wordpress:7.1.5-php8.4
    build:
      context: ./docker
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_HOME: http://localhost:8080
      WORDPRESS_SITEURL: http://localhost:8080
    volumes:
      - wordpress_data:/var/www/html
      - ./site-report-plugin:/var/www/html/wp-content/plugins/shoalsaa-site-report

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
    expose:
      - "1025"

volumes:
  mysql_data:
  wordpress_data:
